{% extends "base.html" %}

{% block title %}Страница не найдена | AI-дайджест ЛОР-врача{% endblock %}

{% block content %}
<section class="section section--narrow">
    <div class="container">
        <div class="error">
            <div class="error__code">404</div>
            <h1 class="error__title">Страница не найдена</h1>
            <p class="error__text">Такой материал пока не существует или ссылка устарела.</p>
            <div class="error__actions">
                <a class="btn btn--primary" href="{{ url_for('index') }}">
                    <span>На главную</span>
                    <svg class="btn__icon" width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <path d="M3.75 9H14.25M14.25 9L9 3.75M14.25 9L9 14.25" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </a>
            </div>
        </div>
    </div>
</section>
{% endblock %}
